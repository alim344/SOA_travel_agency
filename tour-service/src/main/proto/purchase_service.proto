syntax = "proto3";
option go_package = "./proto";

option java_multiple_files = true;
option java_package = "com.example.purchase_service.proto";
option java_outer_classname = "PurchaseServiceProto";

service PurchaseService {
  rpc AddToCart (AddToCartRequest) returns (CartResponse);
  rpc RemoveFromCart (RemoveFromCartRequest) returns (CartResponse);
  rpc Checkout (CheckoutRequest) returns (CheckoutResponse);
  rpc GetCart (GetCartRequest) returns (CartResponse);
  rpc GetToursForTourist (GetToursForTouristRequest) returns (TouristToursResponse);
  rpc IsTourPurchased (IsTourPurchasedRequest) returns (IsTourPurchasedResponse);
  rpc RemoveArchivedTourFromCarts (RemoveArchivedTourRequest) returns (RemoveArchivedTourResponse);


}

message PurchasedTourResponse {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int32 difficulty = 4;
  repeated string tags = 5;
  string status = 6;
  double price = 7;
  int64 author_id = 8;
  double total_distance = 9;
  map<string, int32> duration_by_transport = 10;
}

message AddToCartRequest {
  int64 tourist_id = 1;
  int64 tour_id = 2;
}

message RemoveFromCartRequest {
  int64 tourist_id = 1;
  int64 tour_id = 2;
}

message CheckoutRequest {
  int64 tourist_id = 1;
}

message OrderItem {
  int64 tour_id = 1;
  string tour_name = 2;
  double price = 3;
}

message CartResponse {
  repeated OrderItem items = 1;
  double total_price = 2;
}

message CheckoutResponse {
  repeated string tokens = 1;
}

message GetCartRequest {
  int64 tourist_id = 1;
}

message GetToursForTouristRequest {
  int64 tourist_id = 1;
}

message TouristToursResponse {
  repeated PurchasedTourResponse tours = 1;
}

message IsTourPurchasedRequest {
  int64 tourist_id = 1;
  int64 tour_id = 2;
}

message IsTourPurchasedResponse {
  bool is_purchased = 1;
}

message RemoveArchivedTourRequest {
  int64 tourId = 1;
}

message RemoveArchivedTourResponse {
  bool success = 1;
  string message = 2;
}