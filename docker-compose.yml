services:

  # ─── DATABASES ───────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: stakeholders_db
    environment:
      POSTGRES_DB: stakeholders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      

  mongo:
    image: mongo:7
    container_name: blog_db
    environment:
      MONGO_INITDB_DATABASE: blog
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5.23
    container_name: followers_db
    ports:
      - "7687:7687"  
      - "7474:7474"  # browser
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_dbms_default__listen__address=0.0.0.0
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs


  tour-db:
    image: postgres:15-alpine
    container_name: tour_db
    environment:
      POSTGRES_DB: tourdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - tour_db_data:/var/lib/postgresql/data

  purchase-db:
    image: mongo:7
    container_name: purchase_db
    ports:
      - "27018:27017"
    volumes:
      - purchase_db_data:/data/db

  # ─── SERVICES ────────────────────────────────────────

  stakeholders-service:
    build: ./stakeholders_service    # ← folder with its Dockerfile
    container_name: stakeholders-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stakeholders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres

  blogs-service:
    build: ./blogs_service            # ← folder with its Dockerfile
    container_name: blogs-service
    environment:
      MONGO_URL: mongodb://mongo:27017/blog
      STAKEHOLDERS_URL: http://stakeholders-service:8080   # ← for http calls
      FOLLOWER_SERVICE_URL: http://follower-service:8084
    depends_on:
      - mongo
      - stakeholders-service
      - follower-service

  follower-service:
    build: ./follower_service
    container_name: follower-service
    environment:
      - PORT=8084
      - NEO4J_DB=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASS=password123
      - STAKEHOLDERS_URL=http://stakeholders-service:8080
    depends_on:
      - neo4j
      - stakeholders-service

  tour-service:
    build: ./tour-service
    container_name: tour-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://tour-db:5432/tourdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PURCHASE_GRPC_HOST: purchase-service
      PURCHASE_GRPC_PORT: "9093"
    depends_on:
      - tour-db

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"   
    environment:
      PORT: "8000"
      STAKEHOLDERS_SERVICE_URL: http://stakeholders-service:8080
      BLOG_SERVICE_URL: http://blogs-service:8001
      TOUR_SERVICE_URL: http://tour-service:8085
      FOLLOWER_SERVICE_URL: http://follower-service:8084
      PURCHASE_GRPC_ADDR: purchase-service:9093
      JAEGER_ENDPOINT: jaeger:4317
    depends_on:
      - stakeholders-service
      - blogs-service
      - follower-service
      - tour-service
      - purchase-service
      - jaeger

  purchase-service:
    build: ./purchase_service
    container_name: purchase-service
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://purchase-db:27017/purchase_db
      GRPC_SERVER_PORT: "9093"
      TOUR_GRPC_HOST: tour-service
      TOUR_GRPC_PORT: "9090"
    depends_on:
      - purchase-db
      - tour-service


  # ─── MONITORING ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - cadvisor
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki  

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    ports:
      - "16686:16686"   # jaeger ui
      - "4317:4317"     # otlp grpc gateway salje ovde
    environment:
      - COLLECTOR_OTLP_ENABLED=true
  
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
  neo4j_logs:
  tour_db_data:
  purchase_db_data:
  grafana_data: